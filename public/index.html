<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <title>CRM Inmobiliario</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pantalla de acceso -->
  <section id="login-view" class="login" hidden>
    <form id="login-form" class="card login-card">
      <h1>🏘️ CRM Inmobiliario</h1>
      <p class="muted">Entra con tu usuario y PIN</p>
      <label>Usuario
        <input name="username" autocomplete="username" autocapitalize="none" required>
      </label>
      <label>PIN
        <input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="error" hidden></p>
      <button class="btn primary" type="submit">Entrar</button>
    </form>
  </section>

  <!-- Aplicación -->
  <div id="app-view" hidden>
    <header class="topbar">
      <div class="brand">🏘️ CRM</div>
      <div class="status">
        <span id="conn" class="conn off" title="Conexión en tiempo real">●</span>
        <span id="online" class="online"></span>
      </div>
      <div class="user">
        <button id="me-btn" class="btn ghost small"></button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="dashboard">Resumen</button>
      <button class="tab" data-tab="contacts">Clientes</button>
      <button class="tab" data-tab="deals">Ventas</button>
      <button class="tab" data-tab="projects">Proyectos</button>
      <button class="tab" data-tab="marketing">Marketing</button>
      <button class="tab" data-tab="finance">Finanzas</button>
      <button class="tab" data-tab="tasks">Tareas</button>
      <button class="tab" data-tab="inventory">Inventario</button>
      <button class="tab" data-tab="movements">Movimientos</button>
      <button class="tab admin-only" data-tab="users">Personal</button>
    </nav>

    <main>
      <!-- Módulos del CRM (los dibuja crm.js) -->
      <section id="tab-dashboard" class="tab-panel"></section>
      <section id="tab-contacts" class="tab-panel" hidden></section>
      <section id="tab-deals" class="tab-panel" hidden></section>
      <section id="tab-projects" class="tab-panel" hidden></section>
      <section id="tab-marketing" class="tab-panel" hidden></section>
      <section id="tab-finance" class="tab-panel" hidden></section>
      <section id="tab-tasks" class="tab-panel" hidden></section>

      <!-- Inventario (materiales y suministros) -->
      <section id="tab-inventory" class="tab-panel" hidden>
        <div class="summary" id="summary"></div>
        <div class="toolbar">
          <input id="search" type="search" placeholder="Buscar producto…">
          <select id="category-filter"><option value="">Todas las categorías</option></select>
          <label class="check"><input id="low-filter" type="checkbox"> Solo stock bajo</label>
          <button id="add-product" class="btn primary admin-only">+ Producto</button>
          <a id="export-products" class="btn ghost" href="#">Exportar CSV</a>
        </div>
        <div id="product-list" class="product-list"></div>
      </section>

      <!-- Movimientos -->
      <section id="tab-movements" class="tab-panel" hidden>
        <div class="toolbar">
          <select id="mov-type">
            <option value="">Todos los tipos</option>
            <option value="entrada">Entradas</option>
            <option value="salida">Salidas</option>
            <option value="merma">Mermas</option>
            <option value="ajuste">Ajustes</option>
          </select>
          <input id="mov-date" type="date" title="Filtrar por día">
          <a id="export-movements" class="btn ghost" href="#">Exportar CSV</a>
        </div>
        <ul id="movement-list" class="movement-list"></ul>
      </section>

      <!-- Personal -->
      <section id="tab-users" class="tab-panel" hidden>
        <div class="toolbar">
          <button id="add-user" class="btn primary">+ Persona</button>
        </div>
        <table class="table">
          <thead><tr><th>Nombre</th><th>Usuario</th><th>Área / cargo</th><th>Rol</th><th>Estado</th><th></th></tr></thead>
          <tbody id="user-list"></tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- Diálogo genérico -->
  <dialog id="dialog">
    <form id="dialog-form" method="dialog">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <p id="dialog-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="dialog-cancel">Cancelar</button>
        <button type="submit" class="btn primary" id="dialog-ok">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="crm.js"></script>
  <script src="app.js"></script>
</body>
</html>
